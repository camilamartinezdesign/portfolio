  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n\n    // ---- Rotating headline word ----\n    const rot = this._rotator;\n    if (rot) {\n      const words = ['CONECTA', 'VENDE', 'ENAMORA', 'BRILLA'];\n      let i = 0;\n      this._rotTimer = setInterval(() => {\n        rot.classList.remove('cm-word-in');\n        rot.classList.add('cm-word-out');\n        setTimeout(() => {\n          i = (i + 1) % words.length;\n          rot.textContent = words[i];\n          rot.classList.remove('cm-word-out');\n          rot.classList.add('cm-word-in');\n        }, 380);\n      }, 2200);\n    }\n\n    // ---- Reveal + count-up + image reveal via IntersectionObserver ----\n    const reveals = Array.from(document.querySelectorAll('[data-reveal]'));\n    reveals.forEach((el) => {\n      el.style.opacity = '0';\n      el.style.transform = 'translateY(34px)';\n      el.style.transition = 'opacity .8s cubic-bezier(.16,1,.3,1), transform .8s cubic-bezier(.16,1,.3,1)';\n    });\n    document.querySelectorAll('[data-img-reveal]').forEach((el) => {\n      el.style.clipPath = 'inset(0 0 100% 0)';\n      el.style.transition = 'clip-path 1s cubic-bezier(.16,1,.3,1)';\n    });\n\n    const fmt = (n, sep) => sep ? n.toLocaleString('en-US') : String(n);\n    const runCount = (el) => {\n      const to = parseInt(el.getAttribute('data-count-to'), 10) || 0;\n      const sep = el.getAttribute('data-count-sep') === '1';\n      const suf = el.getAttribute('data-count-suffix') || '';\n      const dur = 1600;\n      const start = performance.now();\n      const tick = (now) => {\n        const t = Math.min(1, (now - start) / dur);\n        const eased = 1 - Math.pow(1 - t, 3);\n        el.textContent = fmt(Math.round(to * eased), sep) + suf;\n        if (t < 1) requestAnimationFrame(tick);\n      };\n      requestAnimationFrame(tick);\n    };\n\n    if ('IntersectionObserver' in window) {\n      const io = new IntersectionObserver((entries) => {\n        entries.forEach((e) => {\n          if (!e.isIntersecting) return;\n          const el = e.target;\n          if (el.hasAttribute('data-reveal')) { el.style.opacity = '1'; el.style.transform = 'none'; }\n          if (el.hasAttribute('data-img-reveal')) { el.style.clipPath = 'inset(0 0 0% 0)'; }\n          if (el.hasAttribute('data-count')) runCount(el);\n          io.unobserve(el);\n        });\n      }, { threshold: 0.18, rootMargin: '0px 0px -8% 0px' });\n      reveals.forEach((el) => io.observe(el));\n      document.querySelectorAll('[data-img-reveal]').forEach((el) => io.observe(el));\n      document.querySelectorAll('[data-count]').forEach((el) => io.observe(el));\n      this._io = io;\n    } else {\n      reveals.forEach((el) => { el.style.opacity = '1'; el.style.transform = 'none'; });\n      document.querySelectorAll('[data-img-reveal]').forEach((el) => { el.style.clipPath = 'none'; });\n      document.querySelectorAll('[data-count]').forEach(runCount);\n    }\n\n    // ---- Sparkle cursor ----\n    const layer = this._cursor;\n    const fine = window.matchMedia && window.matchMedia('(pointer:fine)').matches;\n    if (layer && fine) {\n      const palette = ['#FF2D9E', '#7B3CFF', '#D7FF00', '#00C9AE', '#FF8A00', '#FFC1E8'];\n      const glyphs = ['✦', '✧', '★', '✩', '❋', '✸', '+'];\n      let last = 0;\n      const spawn = (x, y) => {\n        const count = 1 + Math.floor(Math.random() * 2);\n        for (let k = 0; k < count; k++) {\n          const s = document.createElement('span');\n          s.textContent = glyphs[(Math.random() * glyphs.length) | 0];\n          const size = 9 + Math.random() * 15;\n          const jx = (Math.random() - 0.5) * 14;\n          const jy = (Math.random() - 0.5) * 14;\n          s.style.cssText = 'position:absolute; left:' + (x + jx) + 'px; top:' + (y + jy) + 'px; font-size:' + size + 'px; line-height:1; color:' + palette[(Math.random() * palette.length) | 0] + '; pointer-events:none; will-change:transform,opacity; text-shadow:0 0 8px rgba(255,255,255,0.6); filter:drop-shadow(0 0 3px rgba(255,255,255,0.35));';\n          layer.appendChild(s);\n          const dx = (Math.random() - 0.5) * 54;\n          const dy = 14 + Math.random() * 40;\n          const rot = (Math.random() - 0.5) * 260;\n          const dur = 950 + Math.random() * 450;\n          s.animate([\n            { transform: 'translate(-50%,-50%) scale(0) rotate(0deg)', opacity: 0 },\n            { transform: 'translate(calc(-50% + ' + (dx * 0.32) + 'px), calc(-50% + ' + (dy * 0.28) + 'px)) scale(1.12) rotate(' + (rot * 0.35) + 'deg)', opacity: 1, offset: 0.22 },\n            { transform: 'translate(calc(-50% + ' + (dx * 0.7) + 'px), calc(-50% + ' + (dy * 0.62) + 'px)) scale(0.82) rotate(' + (rot * 0.72) + 'deg)', opacity: 0.95, offset: 0.6 },\n            { transform: 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px)) scale(0) rotate(' + rot + 'deg)', opacity: 0 }\n          ], { duration: dur, easing: 'cubic-bezier(.25,.8,.35,1)' }).onfinish = () => s.remove();\n        }\n      };\n      const move = (ev) => {\n        const now = performance.now();\n        if (now - last < 20) return;\n        last = now;\n        spawn(ev.clientX, ev.clientY);\n      };\n      window.addEventListener('mousemove', move, { passive: true });\n      this._curCleanup = () => { window.removeEventListener('mousemove', move); };\n    }\n\n    // ---- Card hover: scale image + arrow + lifted shadow ----\n    document.querySelectorAll('[data-card]').forEach((card) => {\n      const slot = card.querySelector('image-slot');\n      const arrow = card.querySelector('[data-arrow]');\n      const box = card.querySelector('[data-tilt]');\n      const enter = () => {\n        if (slot) { slot.style.transform = 'scale(1.06)'; slot.style.transition = 'transform .6s cubic-bezier(.16,1,.3,1)'; }\n        if (arrow) arrow.style.transform = 'translate(5px,-5px)';\n        if (box) box.style.boxShadow = '12px 12px 0 #FF2D9E';\n      };\n      const leave = () => {\n        if (slot) slot.style.transform = 'scale(1)';\n        if (arrow) arrow.style.transform = 'none';\n        if (box) { box.style.boxShadow = '6px 6px 0 #1A1430'; box.style.transform = 'none'; }\n      };\n      card.addEventListener('mouseenter', enter);\n      card.addEventListener('mouseleave', leave);\n      // 3D tilt\n      if (box && fine) {\n        box.style.transformStyle = 'preserve-3d';\n        box.style.transition = 'box-shadow .3s ease, transform .15s ease';\n        card.addEventListener('mousemove', (ev) => {\n          const r = box.getBoundingClientRect();\n          const px = (ev.clientX - r.left) / r.width - 0.5;\n          const py = (ev.clientY - r.top) / r.height - 0.5;\n          box.style.transform = `perspective(900px) rotateY(${px * 7}deg) rotateX(${-py * 7}deg)`;\n        });\n      }\n    });\n\n    // ---- Experience row hover ----\n    document.querySelectorAll('[data-exp]').forEach((row) => {\n      row.addEventListener('mouseenter', () => { row.style.background = 'rgba(255,255,255,0.10)'; row.style.transform = 'translateX(10px)'; });\n      row.addEventListener('mouseleave', () => { row.style.background = 'transparent'; row.style.transform = 'none'; });\n    });\n\n    // ---- Magnetic CTA ----\n    document.querySelectorAll('[data-magnet]').forEach((btn) => {\n      if (!fine) return;\n      btn.addEventListener('mousemove', (ev) => {\n        const r = btn.getBoundingClientRect();\n        const mx = ev.clientX - r.left - r.width / 2;\n        const my = ev.clientY - r.top - r.height / 2;\n        btn.style.transform = `translate(${mx * 0.3}px, ${my * 0.4}px)`;\n      });\n      btn.addEventListener('mouseleave', () => { btn.style.transform = 'none'; });\n    });\n\n    // ---- Contact link hover ----\n    document.querySelectorAll('[data-link]').forEach((l) => {\n      l.addEventListener('mouseenter', () => { l.style.transform = 'translateX(8px)'; });\n      l.addEventListener('mouseleave', () => { l.style.transform = 'none'; });\n    });\n  }\n\n  componentWillUnmount() {\n    if (this._onScroll) window.removeEventListener('scroll', this._onScroll);\n    if (this._io) this._io.disconnect();\n    if (this._rotTimer) clearInterval(this._rotTimer);\n    if (this._curCleanup) this._curCleanup();\n  }\n\n  renderVals() {\n    return {\n      progressRef: (el) => { this._bar = el; },\n      rotatorRef: (el) => { this._rotator = el; },\n      cursorRef: (el) => { this._cursor = el; },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
